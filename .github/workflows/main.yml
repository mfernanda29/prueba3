name: Python application

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository content
      uses: actions/checkout@v4  # Actualizado a la última versión

    - name: Set up Python
      uses: actions/setup-python@v4  # Actualizado a la última versión
      with:
        python-version: 3.8

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn matplotlib

    - name: List files in data directory
      run: ls -la data  # Esto lista los archivos en el directorio data para verificar

    - name: Run script
      run: python modalidad.py


